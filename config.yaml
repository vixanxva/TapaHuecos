# Configuración del detector. Todos los valores tienen un predeterminado en
# src/tapahuecos/config.py; aquí solo hace falta cambiar lo que se quiera ajustar.

modelo:
  pesos: modelos/best.pt        # resultado de scripts/entrenar.py
  confianza: 0.35               # umbral mínimo de confianza de YOLO
  iou: 0.5                      # umbral de supresión de no máximos
  tamano_imagen: 640            # debe coincidir con el usado al entrenar
  tracker: bytetrack.yaml       # seguimiento incluido en Ultralytics
  dispositivo: null             # null = automático, "cpu", "0" (primera GPU)

video:
  cada_n_fotogramas: 2          # procesar 1 de cada N fotogramas
  inicio_grabacion: null        # ISO 8601 (ej. "2026-10-29T14:30:15"); null = deducir del nombre del archivo
  utc_offset_horas: -5          # Colombia (UTC-5, sin horario de verano)
  desfase_gps_s: 0.0            # corrección fina si el reloj de la cámara y el GPS no coinciden
  rotacion: 0                   # giro extra en sentido horario (0, 90, 180, 270) si el video llega girado
  region: null                  # [x1, y1, x2, y2] en fracciones; ej. [0, 0.45, 1, 1] = solo la franja inferior

segmentacion:
  contraste_minimo: 4.0         # recortes más planos que esto no se segmentan
  area_minima_px: 40            # huecos y malla: contornos más pequeños se descartan como ruido
  # Huecos (D40)
  clahe_limite: 2.0             # realce de contraste local
  clahe_rejilla: 8
  clahe_tesela_min_px: 32       # en recortes pequeños la rejilla se reduce para que cada tesela mida al menos esto
  kernel_suavizado: 5           # desenfoque gaussiano (impar)
  kernel_morfologico: 5         # apertura / cierre para limpiar la máscara
  fraccion_centro: 0.5          # lado de la zona central del recuadro; se conservan las regiones que la tocan
  huecos_desborde_esquinas: 0.25    # Otsu se revisa si cubre más de esta fracción de las esquinas (fuera de la elipse)...
  huecos_nucleo_minimo: 0.65        # ...o menos de esta fracción del núcleo (elipse central de medio tamaño)
  huecos_rareza_alta: 4.0           # rareza (desviaciones frente al asfalto de las esquinas) de las semillas del hueco
  huecos_rareza_baja: 2.0           # rareza mínima por la que crecen las semillas (histéresis)...
  huecos_rareza_relativa: 0.3       # ...que sube a esta fracción del percentil 95 de la rareza del núcleo
  huecos_alternativa_nucleo: 0.15   # la máscara por rareza se descarta si cubre menos que esto del núcleo...
  huecos_alternativa_esquinas: 0.3  # ...o más que esto de las esquinas
  huecos_convexo_max: 1.3           # cada región se completa hasta su contorno convexo si área del casco ≤ esto × área...
  huecos_convexo_esquinas: 0.05     # ...salvo que el casco agregue más de esta fracción de las esquinas
  huecos_halo_solidez: 0.9          # si Otsu es así de compacta (área / casco)...
  huecos_halo_area: 1.6             # ...y la rareza la contiene y solo la agranda hasta este factor, se queda Otsu
  huecos_rareza_lado_px: 155        # la rareza de recortes con área mayor que este lado² se calcula reducida
  # Grietas (D00, D10)
  grieta_valle_dist_max: 4          # distancia (px) a cada lado para medir el valle: ancho máximo de grieta
  grieta_asimetria: 0.5             # penalización cuando los dos lados del valle difieren (borde de sombra, parche, pintura)...
  grieta_asimetria_tolerancia: 2.0  # ...a partir de esta diferencia, en desviaciones (MAD) del recorte
  grieta_escala_percentil: 90       # percentil de la respuesta que se toma como nivel de la textura (unidad de z)
  grieta_escala_minima: 3.0         # mínimo de esa escala (niveles de gris), para no amplificar ruido en asfalto liso
  grieta_pintura_delta: 20.0        # pintura blanca: al menos esto más clara que la mediana del recorte
  grieta_pintura_area_min: 30       # área mínima (px) de una mancha clara o amarilla para tratarla como marca vial
  grieta_pintura_radio: 3           # franja (px) alrededor del borde de la pintura donde se anulan los valles
  grieta_pintura_frac: 0.3          # dentro de la pintura, es grieta lo más oscuro que asfalto + esto × (pintura − asfalto)
  grieta_cuadrado_ratio: 1.5        # con largo / ancho menor que esto se prueban los dos ejes para el camino
  grieta_tramo_ventana: 0.06        # ventana de la media móvil sobre el camino, en fracción de su largo
  grieta_tramo_umbral: 1.5          # media de z sobre el camino a partir de la cual el tramo es grieta...
  grieta_tramo_umbral_bajo: 1.15    # ...y por encima de la cual se prolonga hacia sus extremos tenues
  grieta_semilla_min: 1.0           # z mínimo de cada píxel del camino para ser semilla
  grieta_hueco_max: 0.2             # hueco máximo entre tramos que se rellena, en fracción del largo del camino
  grieta_rama_exclusion: 0.15       # al buscar una rama, radio excluido alrededor de la principal (fracción del lado corto)
  grieta_rama_umbral: 2.0           # umbral de tramo para la rama (más exigente que el de la principal)
  grieta_rama_largo: 0.25           # largo mínimo de un tramo de rama, en fracción del lado largo del recuadro
  grieta_crecer_umbral: 1.3         # z mínimo de los píxeles que se agregan al recuperar el ancho
  grieta_crecer_pasos: 4            # pasos de 1 px de ese crecimiento (limita el ancho)
  # Piel de cocodrilo (D20)
  malla_lado_px: 192                # el recorte se normaliza a un área de lado² px; los tamaños de abajo son a esa escala
  malla_iluminacion_px: 41          # ventana de la mediana que estima la iluminación local
  malla_kernel_px: 5                # tamaño del black-hat que resalta las grietas de la malla
  malla_pintura_min: 30             # pintura = más de 1,3 × y más de esto en niveles sobre la iluminación local
  malla_fraccion_grietas: 0.25      # fracción de píxeles con mayor realce que se toman como grieta
  malla_sigma_px: 12                # radio (sigma) del promedio que da la densidad de grietas
  malla_densidad_rel: 0.7           # es malla donde la densidad supera esto × la densidad media del recuadro
  malla_sombra_rel: 0.65            # sombra = más oscura que esto × el percentil 75 del brillo...
  malla_sombra_azul: 0.1            # ...y más azul que el resto en esta cantidad (3·(B−R)/(B+G+R))
  malla_vegetacion_verde: 30        # vegetación = 2G − R − B por encima de esto (y G > R)

calibracion:
  homografia: calibracion/homografia.npy   # generada con scripts/calibrar_homografia.py
  metros_por_pixel: null                   # alternativa aproximada si no hay homografía

registro:
  min_fotogramas: 3             # un daño debe verse en al menos N fotogramas para registrarse
  max_ausencia: 30              # fotogramas sin ver un daño antes de darlo por terminado
  tolerancia_gps_s: 5.0         # margen permitido fuera del rango de tiempo del GPX
  radio_fusion_m: 8.0           # daños de la misma clase a menos de esto, en recorridos distintos, son el mismo
