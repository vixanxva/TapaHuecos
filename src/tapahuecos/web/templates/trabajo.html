{% extends "base.html" %}
{% block titulo %}{{ trabajo.accion }} · TapaHuecos{% endblock %}
{% block cuerpo %}
<p class="migas"><a href="{{ url_for('index') }}">Acciones</a> / {{ trabajo.accion }}</p>
<h1>{{ trabajo.accion }}</h1>
<p class="comando"><code>{{ trabajo.comando }}</code></p>
<p class="estado en-curso" id="estado" data-id="{{ trabajo.id }}">En curso…</p>
<p><button type="button" id="cancelar"{% if trabajo.estado != 'en_curso' %} hidden{% endif %}>Cancelar</button></p>

<pre class="salida" id="salida" data-desde="{{ total }}">{% for linea in lineas %}{{ linea }}
{% endfor %}</pre>

<p class="migas">
  <a href="{{ url_for('index') }}">Volver a acciones</a> ·
  <a href="{{ url_for('lista_salidas') }}">Ver salidas</a>
</p>
<script src="{{ url_for('static', filename='trabajo.js') }}"></script>
{% endblock %}
