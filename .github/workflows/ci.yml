name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependencias del sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Instalar (sin Ultralytics; las pruebas no lo necesitan)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Generar datos de prueba
        run: python tests/fixtures/generar.py
      - name: Pruebas
        run: pytest -q
